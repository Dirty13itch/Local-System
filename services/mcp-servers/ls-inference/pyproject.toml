[project]
name = "ls-inference"
version = "0.1.0"
description = "Local-System inference MCP server — local model access for any coding tool"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
ls-inference = "ls_inference.server:main"
