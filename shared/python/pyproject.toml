[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-system-shared"
version = "0.1.0"
description = "Shared library for Local-System services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["local_system"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "grpcio-tools>=1.60",
]
