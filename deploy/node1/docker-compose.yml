# Node 1 — Primary Inference Engine
# EPYC 56C/112T · 224GB · 4× RTX 5070 Ti + RTX 4090
#
# Services: inference, model-manager, ollama, vllm

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  inference:
    build:
      context: ../..
      dockerfile: services/inference/Dockerfile
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
      - "${INFERENCE_GRPC_PORT:-50051}:50051"
    env_file:
      - ../../.env
    environment:
      - NODE_NAME=node1
      - NODE_ROLE=inference
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  model-manager:
    build:
      context: ../..
      dockerfile: services/model-manager/Dockerfile
    ports:
      - "${MODEL_MANAGER_PORT:-8005}:8005"
    env_file:
      - ../../.env
    environment:
      - NODE_NAME=node1
    depends_on:
      - inference
    restart: unless-stopped

volumes:
  ollama-data:
