# FOUNDRY — Heavy Inference Node (192.168.1.244)
# EPYC 7663, 256GB RAM, 5x GPUs (4x 5070 Ti 16GB + 1x 4090 24GB)
#
# GPU Layout (Phase 3 — March 2026):
#   GPU 0,1: 2x RTX 5070 Ti 16GB → reasoning TP=2 (Qwen3-32B-AWQ) :8000
#   GPU 2:   RTX 4090 24GB       → coding (GLM-4.7-Flash-GPTQ-4bit) :8002
#   GPU 3:   RTX 5070 Ti 16GB    → creative (Huihui-Qwen3-8B-abliterated-v2 FP8) :8004
#   GPU 4:   RTX 5070 Ti 16GB    → FREE (reserved for future reasoning TP=4)
#
# Models served from VAULT NFS: /mnt/vault/models:/models:ro
# Note: embed/rerank moved to DEV in Phase 3.5a
#
# Usage: docker compose up -d
# Note: Requires NVIDIA Container Toolkit (nvidia-ctk)

services:
  # --- Inference Models ---

  vllm-reasoning:
    image: athanor/vllm:custom
    container_name: vllm-reasoning
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - FLASHINFER_DISABLE_VERSION_CHECK=1
    volumes:
      - /mnt/vault/models:/models:ro
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model /models/Qwen3-32B-AWQ
      --quantization awq
      --enforce-eager
      --tensor-parallel-size 2
      --host 0.0.0.0
      --port 8000
      --max-model-len 16384
      --gpu-memory-utilization 0.85
      --max-num-seqs 32
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --swap-space 16
      --enable-sleep-mode
      --enable-prefix-caching
      --kv-cache-dtype fp8_e5m2

  vllm-coding:
    image: athanor/vllm:v2
    container_name: vllm-coding
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - NVIDIA_VISIBLE_DEVICES=2
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - FLASHINFER_DISABLE_VERSION_CHECK=1
    volumes:
      - /mnt/vault/models:/models:ro
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model /models/GLM-4.7-Flash-GPTQ-4bit
      --quantization gptq
      --host 0.0.0.0
      --port 8002
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --max-num-seqs 8
      --enable-prefix-caching
      --enable-sleep-mode
      --swap-space 4
      --trust-remote-code

  vllm-creative:
    image: athanor/vllm:v2
    container_name: vllm-creative
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    ipc: host
    shm_size: 4g
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - FLASHINFER_DISABLE_VERSION_CHECK=1
    volumes:
      - /mnt/vault/models:/models:ro
    command: >
      python3 -m vllm.entrypoints.openai.api_server
      --model /models/Huihui-Qwen3-8B-abliterated-v2
      --quantization fp8
      --dtype float16
      --host 0.0.0.0
      --port 8004
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --max-num-seqs 8
      --enable-prefix-caching
      --enable-sleep-mode
      --swap-space 4
      --trust-remote-code

  # --- Monitoring ---

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)(821205|/)'
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    container_name: dcgm-exporter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"
    restart: unless-stopped
