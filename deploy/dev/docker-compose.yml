# DEV — Development + CI/CD + Monitoring
# AMD Ryzen 9 9900X · 64GB · RTX 5060 Ti
#
# Services: prometheus, grafana, inference (overflow)

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Optional: overflow inference using 5060 Ti
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - inference

  inference:
    build:
      context: ../..
      dockerfile: services/inference/Dockerfile
    ports:
      - "${INFERENCE_PORT:-8001}:8001"
    env_file:
      - ../../.env
    environment:
      - NODE_NAME=dev
      - NODE_ROLE=dev
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    profiles:
      - inference
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  ollama-data:
