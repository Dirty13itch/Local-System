global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["10.0.0.14:8000"]
        labels:
          node: "desk"

  - job_name: "inference-node1"
    static_configs:
      - targets: ["10.0.0.11:8001"]
        labels:
          node: "node1"

  - job_name: "inference-node2"
    static_configs:
      - targets: ["10.0.0.12:8001"]
        labels:
          node: "node2"

  - job_name: "orchestrator"
    static_configs:
      - targets: ["10.0.0.14:8002"]
        labels:
          node: "desk"

  - job_name: "rag"
    static_configs:
      - targets: ["10.0.0.13:8003"]
        labels:
          node: "vault"

  - job_name: "storage"
    static_configs:
      - targets: ["10.0.0.13:8004"]
        labels:
          node: "vault"

  - job_name: "model-manager"
    static_configs:
      - targets: ["10.0.0.11:8005"]
        labels:
          node: "node1"
