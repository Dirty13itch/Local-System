# DESK — UI + API Gateway + Orchestrator
# Intel Core i7-13700K · 64GB · RTX 3060
#
# Services: gateway, orchestrator, ui, redis

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    env_file:
      - ../../.env
    environment:
      - NODE_NAME=desk
      - NODE_ROLE=orchestrator
    depends_on:
      - redis
    restart: unless-stopped

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8002}:8002"
      - "${ORCHESTRATOR_GRPC_PORT:-50052}:50052"
    env_file:
      - ../../.env
    environment:
      - NODE_NAME=desk
      - NODE_ROLE=orchestrator
    depends_on:
      - redis
    restart: unless-stopped

  ui:
    build:
      context: ../..
      dockerfile: ui/Dockerfile
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${GATEWAY_PORT:-8000}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  redis-data:
