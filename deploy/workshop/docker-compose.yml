# WORKSHOP — Creative Pipeline (ComfyUI) + Monitoring
#
# GPU Layout (verified 2026-03-06):
#   GPU 0: RTX 5090 32GB  → ComfyUI (face-ID pipeline: Flux FP8 + PuLID + InsightFace + GFPGAN)
#   GPU 1: RTX 5060 Ti 16GB → idle (too small for useful LLM — OOM with 8B+ models)
#
# No vLLM on WORKSHOP — "fast" alias in LiteLLM routes to FOUNDRY:8004.
# ComfyUI is pinned to GPU 0 (5090) via device_ids and NVIDIA_VISIBLE_DEVICES.

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    image: athanor/comfyui:blackwell
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfyui-output:/opt/ComfyUI/output
      - comfyui-input:/opt/ComfyUI/input
      - comfyui-custom-nodes:/opt/ComfyUI/custom_nodes
      - comfyui-user:/opt/ComfyUI/user
      - /mnt/vault/models:/mnt/vault/models:ro
      - /opt/athanor/comfyui/extra_model_paths.yaml:/opt/ComfyUI/extra_model_paths.yaml:ro
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0

  # NVIDIA DCGM GPU metrics exporter
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Node system metrics exporter
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped

volumes:
  comfyui-output:
  comfyui-input:
  comfyui-custom-nodes:
  comfyui-user:
