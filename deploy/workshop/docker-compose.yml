# WORKSHOP — Fast Inference + Creative Pipeline
# Specs populated by scripts/discover.sh
#
# vLLM runs as a systemd service (not Docker) for direct GPU access.
# This compose file is for auxiliary services.

services:
  # ComfyUI for image generation (Flux + Wan2.2)
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    ports:
      - "8188:8188"
    volumes:
      - /mnt/models/diffusion:/opt/ComfyUI/models
      - comfyui-output:/opt/ComfyUI/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Node metrics exporter
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped

  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.0
    ports:
      - "9835:9835"
    restart: unless-stopped

volumes:
  comfyui-output:
