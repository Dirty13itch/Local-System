# ============================================================
# LiteLLM Configuration — Local-System Inference Routing
# ============================================================
# Routes model requests to vLLM instances via model aliases.
# IPs and ports are populated after Phase 0.1 auto-discovery.
# ============================================================
#
# Model aliases:
#   reasoning — primary reasoning model (largest available)
#   fast      — fast responses (smaller or sparse MoE model)
#   embedding — embedding model for vector search
#   coding    — coding specialist model
#
# After discovery, replace ${FOUNDRY_IP}, ${WORKSHOP_IP} etc.
# with actual IPs from docs/infrastructure-report.md.
# ============================================================

model_list:
  # --- Reasoning: primary large model on FOUNDRY ---
  - model_name: "reasoning"
    litellm_params:
      model: "openai/reasoning"
      api_base: "http://${FOUNDRY_IP}:8000/v1"
      api_key: "not-needed"
    model_info:
      max_tokens: 32768

  # --- Fast: smaller/sparse model on WORKSHOP ---
  - model_name: "fast"
    litellm_params:
      model: "openai/fast"
      api_base: "http://${WORKSHOP_IP}:8000/v1"
      api_key: "not-needed"
    model_info:
      max_tokens: 32768

  # --- Embedding: Qwen3-Embedding-0.6B on FOUNDRY ---
  - model_name: "embedding"
    litellm_params:
      model: "openai/embedding"
      api_base: "http://${FOUNDRY_IP}:8001/v1"
      api_key: "not-needed"

  # --- Coding: coding specialist (if deployed) ---
  - model_name: "coding"
    litellm_params:
      model: "openai/coding"
      api_base: "http://${FOUNDRY_IP}:8002/v1"
      api_key: "not-needed"
    model_info:
      max_tokens: 65536

  # --- OpenAI compatibility aliases ---
  - model_name: "gpt-4"
    litellm_params:
      model: "openai/reasoning"
      api_base: "http://${FOUNDRY_IP}:8000/v1"
      api_key: "not-needed"

  - model_name: "gpt-3.5-turbo"
    litellm_params:
      model: "openai/fast"
      api_base: "http://${WORKSHOP_IP}:8000/v1"
      api_key: "not-needed"

  - model_name: "text-embedding-ada-002"
    litellm_params:
      model: "openai/embedding"
      api_base: "http://${FOUNDRY_IP}:8001/v1"
      api_key: "not-needed"

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 300

litellm_settings:
  drop_params: true
  set_verbose: false
