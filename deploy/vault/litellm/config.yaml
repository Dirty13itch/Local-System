# Local-System LiteLLM Proxy Configuration
# Routes model requests to vLLM instances and cloud APIs via aliases
#
# GPU Layout (FOUNDRY 192.168.1.244):
#   GPU 0,1: reasoning TP=2 (Qwen3-32B-AWQ) :8000
#   GPU 2:   coding (Qwen3-32B-AWQ, 4090)   :8002
#   GPU 3:   embedding + reranker            :8001 / :8003
# WORKSHOP (192.168.1.225):
#   GPU 0:   fast (Qwen3-14B FP8, 5090)     :8000

model_list:
  # === LOCAL MODELS (zero cost, full privacy) ===

  - model_name: "reasoning"
    litellm_params:
      model: "hosted_vllm//models/Qwen3-32B-AWQ"
      api_base: "http://192.168.1.244:8000/v1"
      api_key: "not-needed"

  - model_name: "coding"
    litellm_params:
      model: "hosted_vllm//models/Qwen3-32B-AWQ"
      api_base: "http://192.168.1.244:8002/v1"
      api_key: "not-needed"

  - model_name: "fast"
    litellm_params:
      model: "hosted_vllm/fast"
      api_base: "http://192.168.1.225:8000/v1"
      api_key: "not-needed"

  - model_name: "embedding"
    litellm_params:
      model: "hosted_vllm//models/Qwen3-Embedding-0.6B"
      api_base: "http://192.168.1.244:8001/v1"
      api_key: "not-needed"
    model_info:
      mode: embedding

  - model_name: "reranker"
    litellm_params:
      model: "hosted_vllm//models/Qwen3-Reranker-0.6B"
      api_base: "http://192.168.1.244:8003/v1"
      api_key: "not-needed"

  - model_name: "local"
    litellm_params:
      model: "ollama/dolphin-mistral:7b"
      api_base: "http://192.168.1.189:11434"

  # === CLOUD APIS (uncomment + set env vars when ready) ===

  # - model_name: "claude"
  #   litellm_params:
  #     model: "anthropic/claude-sonnet-4-20250514"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  # - model_name: "deepseek"
  #   litellm_params:
  #     model: "deepseek/deepseek-chat"
  #     api_key: "os.environ/DEEPSEEK_API_KEY"

  # - model_name: "gemini"
  #   litellm_params:
  #     model: "gemini/gemini-2.5-pro"
  #     api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  model_group_alias:
    "gpt-4": { model: "reasoning", hidden: false }
    "gpt-3.5-turbo": { model: "fast", hidden: false }
    "text-embedding-ada-002": { model: "embedding", hidden: false }

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  background_health_checks: true
  health_check_interval: 300
