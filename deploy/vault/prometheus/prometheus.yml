# Prometheus Configuration — Local-System Cluster Monitoring
# IPs populated after running scripts/discover.sh
# Update targets below with real IPs from docs/infrastructure-report.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Node Metrics (node_exporter on all Linux nodes) ---
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '${FOUNDRY_HOST}:9100'
          - '${WORKSHOP_HOST}:9100'
          - '${VAULT_HOST}:9100'
          - '${DEV_HOST}:9100'
        labels:
          cluster: 'local-system'

  # --- GPU Metrics (DCGM/nvidia-exporter on GPU nodes) ---
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets:
          - '${FOUNDRY_HOST}:9835'
          - '${WORKSHOP_HOST}:9835'
        labels:
          cluster: 'local-system'

  # --- Core Services (on VAULT) ---
  - job_name: 'gateway'
    static_configs:
      - targets: ['localhost:8700']

  - job_name: 'memory'
    static_configs:
      - targets: ['localhost:8720']

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['localhost:8703']

  # --- Inference ---
  - job_name: 'litellm'
    static_configs:
      - targets: ['localhost:4000']

  - job_name: 'vllm-foundry'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['${FOUNDRY_HOST}:8000']

  - job_name: 'vllm-workshop'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['${WORKSHOP_HOST}:8000']

  # --- Databases ---
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:6333']
