# MOBILE — Remote Client (Lightweight)
# ASUS ROG Strix G17 · R9 5900HX · 64GB · RTX 3070M
#
# Services: ollama (for offline use), thin gateway

services:
  # Local Ollama for offline inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - offline

volumes:
  ollama-data:
