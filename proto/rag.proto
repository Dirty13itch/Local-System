syntax = "proto3";

package local_system;

import "common.proto";

option go_package = "github.com/Dirty13itch/Local-System/proto";

// RAG service — document ingestion, embedding, and retrieval.

service RAGService {
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc DeleteDocuments(DeleteRequest) returns (DeleteResponse);
  rpc ListCollections(Empty) returns (CollectionList);
  rpc GetCollectionInfo(CollectionRequest) returns (CollectionInfo);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message IngestRequest {
  string collection = 1;
  repeated DocumentInput documents = 2;
  ChunkingConfig chunking = 3;
}

message DocumentInput {
  string source = 1;        // file path or URL
  string content = 2;       // raw text content (if not a file)
  map<string, string> metadata = 3;
}

message ChunkingConfig {
  int32 chunk_size = 1;
  int32 chunk_overlap = 2;
  string strategy = 3;      // fixed, sentence, paragraph, semantic
}

message IngestResponse {
  int32 documents_processed = 1;
  int32 chunks_created = 2;
  repeated string document_ids = 3;
}

message SearchRequest {
  string query = 1;
  string collection = 2;
  int32 top_k = 3;
  float score_threshold = 4;
  map<string, string> filters = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total = 2;
}

message SearchResult {
  string document_id = 1;
  string source = 2;
  string content = 3;
  float score = 4;
  map<string, string> metadata = 5;
  int32 chunk_index = 6;
}

message DeleteRequest {
  string collection = 1;
  repeated string document_ids = 2;
}

message DeleteResponse {
  int32 deleted_count = 1;
}

message CollectionRequest {
  string name = 1;
}

message CollectionInfo {
  string name = 1;
  int32 document_count = 2;
  int32 chunk_count = 3;
  int32 embedding_dimensions = 4;
  int64 size_bytes = 5;
}

message CollectionList {
  repeated CollectionInfo collections = 1;
}
