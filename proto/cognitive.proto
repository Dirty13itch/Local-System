syntax = "proto3";

package athanor;

import "common.proto";

// Cognitive Workspace — GWT attention mechanism

service CognitiveWorkspace {
  rpc GetState (Empty) returns (CognitiveStateResponse);
  rpc SetFocus (FocusRequest) returns (StatusResponse);
  rpc SubmitBid (BidRequest) returns (BidResponse);
  rpc Broadcast (BroadcastRequest) returns (StatusResponse);
  rpc RunCycle (CycleRequest) returns (CycleResponse);
  rpc ListSpecialists (Empty) returns (SpecialistList);
}

message CognitiveStateResponse {
  string active_specialist = 1;
  string attention_focus = 2;
  int32 cycle_count = 3;
}

message FocusRequest {
  string focus = 1;
}

message BidRequest {
  string specialist = 1;
  float relevance_score = 2;
  string reasoning = 3;
  string proposed_action = 4;
  int32 estimated_tokens = 5;
}

message BidResponse {
  string status = 1;   // "won" or "outbid"
  string specialist = 2;
  int32 cycle = 3;
}

message BroadcastRequest {
  string source_specialist = 1;
  string content = 2;
  map<string, string> context = 3;
}

message CycleRequest {
  string input_text = 1;
}

message CycleResponse {
  int32 cycle = 1;
  string active_specialist = 2;
  string status = 3;
}

message SpecialistList {
  repeated Specialist specialists = 1;
}

message Specialist {
  string id = 1;
  string name = 2;
  string description = 3;
  bool active = 4;
  string model = 5;
}
