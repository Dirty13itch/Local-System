syntax = "proto3";

package local_system;

import "common.proto";

option go_package = "github.com/Dirty13itch/Local-System/proto";

// Orchestrator service — manages agents, tasks, and workflows.

service OrchestratorService {
  rpc CreateTask(CreateTaskRequest) returns (TaskResponse);
  rpc GetTask(TaskRequest) returns (TaskResponse);
  rpc CancelTask(TaskRequest) returns (TaskResponse);
  rpc ListTasks(ListTasksRequest) returns (TaskListResponse);
  rpc StreamTaskEvents(TaskRequest) returns (stream TaskEvent);
  rpc ListAgents(Empty) returns (AgentListResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message CreateTaskRequest {
  string description = 1;
  string agent_id = 2;
  string model = 3;
  repeated string tools = 4;
  int32 max_iterations = 5;
  Metadata metadata = 6;
}

message TaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  string status = 1;  // filter by status
  int32 limit = 2;
  int32 offset = 3;
}

message TaskResponse {
  string id = 1;
  string agent_id = 2;
  string description = 3;
  string status = 4;
  string result = 5;
  string error = 6;
  int64 created_at = 7;
  int64 completed_at = 8;
}

message TaskListResponse {
  repeated TaskResponse tasks = 1;
  int32 total = 2;
}

message TaskEvent {
  string task_id = 1;
  string event_type = 2;  // thinking, tool_call, tool_result, message, error, completed
  string data = 3;        // JSON payload
  int64 timestamp = 4;
}

message AgentConfig {
  string id = 1;
  string name = 2;
  string system_prompt = 3;
  string model = 4;
  repeated string tools = 5;
  int32 max_iterations = 6;
}

message AgentListResponse {
  repeated AgentConfig agents = 1;
}
