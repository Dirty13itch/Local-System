syntax = "proto3";

package athanor;

import "common.proto";

// Memory Service — 6-tier cognitive memory system

service MemoryService {
  // Working Memory (Redis — volatile)
  rpc GetWorkingContext (Empty) returns (WorkingContextResponse);
  rpc UpdateWorkingContext (WorkingContextRequest) returns (StatusResponse);

  // Episodic Memory (Qdrant — timestamped events)
  rpc StoreEpisode (EpisodeRequest) returns (StatusResponse);
  rpc ListEpisodes (ListRequest) returns (EpisodeList);

  // Memory Search (across tiers)
  rpc SearchMemory (MemorySearchRequest) returns (MemorySearchResponse);

  // Consolidation
  rpc TriggerConsolidation (Empty) returns (StatusResponse);
}

enum MemoryTier {
  PROCEDURAL = 0;
  WORKING = 1;
  EPISODIC = 2;
  SEMANTIC = 3;
  RESOURCE = 4;
  KNOWLEDGE_VAULT = 5;
}

message WorkingContextResponse {
  string active_task = 1;
  repeated string active_priorities = 2;
  repeated string unresolved_questions = 3;
}

message WorkingContextRequest {
  string active_task = 1;
  repeated string active_priorities = 2;
  repeated string unresolved_questions = 3;
}

message EpisodeRequest {
  string id = 1;
  string event_type = 2;
  string summary = 3;
  string outcome = 4;
  map<string, string> details = 5;
}

message EpisodeList {
  repeated Episode episodes = 1;
}

message Episode {
  string id = 1;
  string event_type = 2;
  string summary = 3;
  string outcome = 4;
  string timestamp = 5;
}

message ListRequest {
  int32 limit = 1;
}

message MemorySearchRequest {
  string query = 1;
  repeated MemoryTier tiers = 2;
  int32 top_k = 3;
  float score_threshold = 4;
}

message MemorySearchResponse {
  repeated MemoryEntry results = 1;
  string query = 2;
  int32 total = 3;
}

message MemoryEntry {
  string id = 1;
  MemoryTier tier = 2;
  string content = 3;
  float confidence = 4;
  map<string, string> metadata = 5;
}
