syntax = "proto3";

package local_system;

import "common.proto";

option go_package = "github.com/Dirty13itch/Local-System/proto";

// Inference service — handles LLM generation across backends.

service InferenceService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatRequest) returns (stream StreamChunk);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc ListModels(Empty) returns (ModelList);
  rpc GetModelStatus(ModelStatusRequest) returns (ModelStatus);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ChatMessage {
  string role = 1;    // system, user, assistant, tool
  string content = 2;
  string name = 3;
  string tool_call_id = 4;
  repeated ToolCall tool_calls = 5;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_json = 3;  // JSON Schema
}

message ChatRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  float temperature = 3;
  int32 max_tokens = 4;
  bool stream = 5;
  repeated ToolDefinition tools = 6;
  string request_id = 7;
  Metadata metadata = 8;
}

message ChatResponse {
  string id = 1;
  string model = 2;
  ChatMessage message = 3;
  TokenUsage usage = 4;
  int64 created_at = 5;
  double latency_ms = 6;
}

message StreamChunk {
  string id = 1;
  string model = 2;
  string delta = 3;
  string finish_reason = 4;
}

message EmbedRequest {
  string model = 1;
  repeated string texts = 2;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  TokenUsage usage = 2;
}

message Embedding {
  repeated float values = 1;
  int32 dimensions = 2;
}

message ModelStatusRequest {
  string model = 1;
}

message ModelStatus {
  string name = 1;
  string backend = 2;
  bool loaded = 3;
  int64 size_bytes = 4;
  string quantization = 5;
  int32 context_length = 6;
  int32 vram_usage_mb = 7;
  string node = 8;
}

message ModelList {
  repeated ModelStatus models = 1;
}
